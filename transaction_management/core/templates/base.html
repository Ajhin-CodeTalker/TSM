<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Management System</title>

    <!-- ✅ TailwindCSS CDN (no installation needed) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #f7f9fc;
        }
        /* Page Wrapper */
.tracking-wrapper {
    max-width: 900px;
    margin: 20px auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
}

/* Title */
.tracking-title {
    text-align: center;
    font-weight: 700;
    margin-bottom: 20px;
}

/* Search Box */
.tracking-search-box {
    background: #fff3c8;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.tracking-input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-top: 5px;
}

.tracking-btn {
    display: block;
    margin: 15px auto 0;
    background: #1e90ff;
    color: white;
    border: none;
    padding: 10px 30px;
    border-radius: 6px;
    font-weight: bold;
}

/* Request + Status Box */
.tracking-status-box {
    display: flex;
    gap: 10px;
    padding: 20px;
    border-radius: 8px;
    border: 2px solid #8dc6ff;
    background: #e0f1ff;
}

.left-panel, .right-panel {
    flex: 1;
    background: #fffde9;
    padding: 15px;
    border-radius: 6px;
}

/* ---- Progress Bar ---- */
.status-steps-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 10px;
}

.status-step {
    text-align: center;
}

.step-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.step-circle.done {
    background: #4caf50;
    color: white;
}

.step-circle.active {
    background: #1e90ff;
    color: white;
}

.step-circle.pending {
    background: #ddd;
    color: #777;
}

.status-line {
    height: 6px;
    flex: 1;
    background: #ddd;
    border-radius: 4px;
    margin: 0 10px;
}

/* Responsive Layout */
@media (max-width: 768px) {
    .tracking-status-box {
        flex-direction: column;
    }

    .status-steps-container {
        flex-direction: column;
        gap: 15px;
    }

    .status-line {
        width: 60%;
        height: 4px;
        margin: 0 auto;
    }
}

    </style>
</head>
<body class="min-h-screen">

    <!-- 🎯 TOP HEADER (matches your screenshot) -->
    <header class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">

            <!-- Logo + Title -->
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-semibold text-gray-800">
                        Transaction Management System
                    </h1>
                    <p class="text-sm text-gray-500">Registrar Document Management Platform</p>
                </div>
            </div>

            <!-- Profile (static placeholder, dynamic optional) -->
            <div class="hidden md:flex items-center space-x-3">
                <div class="text-right">
                    <p class="text-sm font-medium text-gray-700">Maria Santos</p>
                    <p class="text-xs text-gray-500">Senior Registrar</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-semibold">
                    MS
                </div>
            </div>
        </div>
    </header>

    <!-- 🧭 NAVIGATION BAR -->
    <nav class="bg-white border-b shadow-sm">
        <div class="max-w-7xl mx-auto flex space-x-8 px-6 py-3 text-gray-600 font-medium">

            {% block navbar %}
            <!-- Default navbar IF not overwritten -->
            <a href="#" class="hover:text-blue-600">Dashboard</a>
            {% endblock %}
        </div>
    </nav>

    <!-- 📌 MAIN CONTENT WRAPPER -->
    <main class="max-w-7xl mx-auto p-6">
        {% block content %}
        {% endblock %}
    </main>

    <!-- 🦶 FOOTER -->
    <footer class="text-center py-4 text-gray-500 text-sm">
        © 2025 Cavite State University – Transaction System
    </footer>

</body>
</html>
