<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Management System</title>

    <!-- ✅ Add Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">


    <!-- Create a condition that only allows this part to be shown towards registrar frame only-->
{% if request.user.is_authenticated and request.user.profile.is_registrar %}
<header>
  <h1>Transaction Management System</h1>
  <nav>
      <a href="{% url 'core:registrar_dashboard' %}">Home</a>
      <a href="{% url 'core:registrar_appointments' %}">Appointments</a>
      <a href="{% url 'core:registrar_certificates' %}">Certificates</a>
      <a href="{% url 'core:approval_list' %}">Pending Accounts</a>
      <a href="{% url 'core:logout' %}">Logout</a>
  </nav>
</header>
{% endif %}


    <!-- Main content -->
    <main class="flex-grow container mx-auto p-6">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-green-900 text-white text-center py-3 mt-6">
        <p>&copy; Cavite State University — Transaction Management System</p>
    </footer>

</body>
</html>
