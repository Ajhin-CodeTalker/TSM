<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Management System</title>

    <!-- ✅ Add Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-green-800 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Transaction Management System</h1>
            <nav class="space-x-6">
                <a href="{% url 'core:registrar_dashboard' %}" class="hover:underline">Home</a>
                <a href="{% url 'core:registrar_appointments' %}" class="hover:underline">Appointments</a>
                <a href="{% url 'core:registrar_certificates' %}" class="hover:underline">Certificates</a>
                <a href="{% url 'core:approval_list' %}" class="hover:underline">Pending Accounts</a>
                <a href="{% url 'core:logout' %}" class="hover:underline">Logout</a>
            </nav>
        </div>
    </header>

    <!-- Main content -->
    <main class="flex-grow container mx-auto p-6">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-green-900 text-white text-center py-3 mt-6">
        <p>&copy; Cavite State University — Transaction Management System</p>
    </footer>

</body>
</html>
