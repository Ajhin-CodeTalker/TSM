{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="{% static 'core/Style.css' %}">
    <script src="https://kit.fontawesome.com/cda339b82d.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="login">
        
        <form id="registrationForm"
              method="post"
              action="{% url 'core:register' %}"
              enctype="multipart/form-data">
            
            {% csrf_token %}
            <h2>Sign Up</h2>

            <!-- FIRST NAME -->
            <div class="names left">
                <input type="text" name="first_name" placeholder="First Name" required>
            </div>

            <!-- LAST NAME -->
            <div class="names right">
                <input type="text" name="last_name" placeholder="Last Name" required>
            </div>

            <!-- USERNAME -->
            <div class="inputBox">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <!-- EMAIL -->
            <div class="inputBox">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="Email (@cvsu.edu.ph)" required>
            </div>

            <!-- STUDENT NUMBER -->
            <div class="inputBox">
                <i class="fa-solid fa-hashtag"></i>
                <input type="text" name="student_number" placeholder="Student Number" required>
            </div>

            <!-- COURSE -->
            <div class="inputBox">
                <i class="fa-solid fa-book"></i>
                <input type="text" name="course" placeholder="Course" required>
            </div>

            <!-- YEAR LEVEL -->
            <div class="inputBox">
                <i class="fa-solid fa-layer-group"></i>
                <select name="year_level" required>
                    <option value="">Select Year Level</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <!-- DOCUMENT UPLOAD -->
            <div class="inputBox">
                <i class="fa-solid fa-file"></i>
                <input type="file" name="document" required>
            </div>

            <!-- PASSWORD -->
            <div class="inputBox">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <div class="toggle">
                    <button type="button" id="togglePassword"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="inputBox">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="confirmPass" name="confirm_password" placeholder="Confirm Password" required>
                <div class="toggle">
                    <button type="button" id="toggleConfirmPassword"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>

            <br>

            <div class="submit">
                <input type="submit" value="Sign Up">
            </div>

            <div class="registration">
                <p>Already have an account? <a href="{% url 'core:login' %}"><b>Sign in</b></a></p>
            </div>

        </form>    
    </div>

<script>
    // PASSWORD TOGGLE
    document.getElementById("togglePassword").addEventListener("click", function() {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
    });

    document.getElementById("toggleConfirmPassword").addEventListener("click", function() {
        const input = document.getElementById("confirmPass");
        input.type = input.type === "password" ? "text" : "password";
    });
</script>

</body>
</html>
