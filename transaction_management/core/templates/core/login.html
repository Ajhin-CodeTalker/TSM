{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="{% static 'core/Style.css' %}">
    <script src="https://kit.fontawesome.com/cda339b82d.js" crossorigin="anonymous"></script>

    <style>
        /* 🔒 Hide registrar link by default */
        .secret-link,
    .admin_secret_link {
        display: none;
    }

    </style>
</head>
<body>
    <div class="login">
        <form method="post">
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="p-2 text-white text-sm rounded
                        {% if message.tags == 'error' %}
                            bg-red-500
                        {% elif message.tags == 'success' %}
                            bg-green-500
                        {% endif %}
                    ">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            {% endif %}

            {% csrf_token %}
            <h2>Sign In</h2>

            <div class="inputBox">
                <i class="fa-solid fa-user"></i>
                <input id="emailInput" type="text" name="email" placeholder="Email" autocomplete="off" required>
            </div>

            <div class="inputBox">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <div class="submit">
                <input type="submit" value="Sign In">
            </div>

            <div class="registration">
                <p>Don’t have an account? 
                    <a href="{% url 'core:register' %}"><b>Sign up</b></a>
                </p>

                <!-- 🔒 This will be hidden unless secret code is typed -->
                <p class="secret-link">
                    Registrar?
                    <a href="{% url 'core:registrar_register' %}"><b>Register here</b></a>
                </p>

                <p class="admin_secret_link">
                    Admin
                    <a href="/admin/"> Click here!</a>
                </p>
            </div>

        </form>
    </div>

    <!-- SECRET TRIGGER SCRIPT -->
    <script>
        const emailInput = document.getElementById("emailInput");
        const secretLink = document.querySelector(".secret-link");
        const admin_secret = document.querySelector(".admin_secret_link");



        const trigger = "@registrar";  // <-- changeable secret code here
        const trigger_admin = "@admin" // <--- This is the code to view the admin frame


        emailInput.addEventListener("input", () => {

            // This is for registrar
            if (emailInput.value.includes(trigger)) {
                secretLink.style.display = "block";   // show
            } else {
                secretLink.style.display = "none";    // hide
            }


            // This is for admin
            if(emailInput.value.includes(trigger_admin)){
                admin_secret.style.display = "block"; // This condition will show the user
            } else {
                admin_secret.style.display = "none"; // This will hide
            }
        });


        

    </script>

</body>
</html>
