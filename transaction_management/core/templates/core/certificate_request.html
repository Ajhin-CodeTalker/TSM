
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #f7d348, #2ea7e0);
  }

  .cert-container {
    width: 90%;
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .form-section {
    background: #ffefb5;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .form-section p label {
    font-weight: bold;
  }

  .form-section input,
  .form-section select,
  .form-section textarea {
    width: 100%;
    margin-top: 5px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .submit-btn {
    background: #1d5adb;
    color: white;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  .submit-btn:hover {
    background: #184cbc;
  }

  .requests-box {
    background: #cfe2f3;
    padding: 20px;
    border-radius: 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
  }

  th {
    background: #f3f3f3;
    font-weight: bold;
  }
</style>

<nav style="background-color: #004d00; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 20px;">
  <a href="{% url 'core:student_dashboard' %}" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Home</a>
  <a href="{% url 'core:student_appointments' %}" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Appointment</a>
  <a href="{% url 'core:logout' %}" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Logout</a>
</nav>

<div class="cert-container">
  <h1 style="text-align:center; margin-top:0;">Certificate Request</h1>

  <div class="form-section">
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="submit-btn">Submit Request</button>
    </form>
  </div>

</div>
{% endblock %}
